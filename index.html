<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>출근길 추월</title>
    <!-- Tailwind CSS for styling screens and overlays -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Touch action prevention to ensure quick mobile response without scrolling/zooming */
        body, button, canvas {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom font family */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-2 sm:p-4 overflow-hidden">

    <!-- Main Container -->
    <div class="relative w-full max-w-[400px] h-[92vh] max-h-[750px] bg-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-slate-700">

        <!-- 1. START SCREEN -->
        <div id="start-screen" class="absolute inset-0 z-20 bg-slate-900/95 flex flex-col justify-between p-6 text-center">
            <div class="my-auto space-y-6">
                <div class="inline-block p-3 bg-amber-500/20 rounded-2xl border border-amber-500/30 mb-2">
                    <span class="text-4xl">🚗</span>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-amber-400">출근길 추월</h1>
                <p class="text-slate-300 text-base leading-relaxed px-2">
                    60초 동안 부딪히지 않고<br>앞차를 최대한 많이 추월하세요!
                </p>
                <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 text-sm text-slate-400 space-y-1">
                    <p class="font-semibold text-slate-200">조작 방법</p>
                    <p>키보드 방향키 <span class="bg-slate-700 text-amber-300 px-1.5 py-0.5 rounded font-mono">←</span> <span class="bg-slate-700 text-amber-300 px-1.5 py-0.5 rounded font-mono">→</span> 또는 하단 <span class="bg-slate-700 text-amber-300 px-2 py-0.5 rounded">◀</span> <span class="bg-slate-700 text-amber-300 px-2 py-0.5 rounded">▶</span> 버튼</p>
                </div>
            </div>

            <button id="start-btn" class="w-full py-4 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-black text-lg rounded-xl shadow-lg transition-all transform active:scale-95 mb-2">
                게임 시작
            </button>
        </div>

        <!-- 2. GAME UI OVERLAY (Top bar) -->
        <div id="game-ui" class="absolute top-0 left-0 right-0 z-10 p-4 flex justify-between items-center bg-gradient-to-b from-slate-950/80 to-transparent pointer-events-none">
            <!-- Score & Floating +1 -->
            <div class="relative flex items-center gap-2 bg-slate-900/80 border border-slate-700 px-3 py-1.5 rounded-full">
                <span class="text-xs text-slate-400 font-bold">추월</span>
                <span id="score-text" class="text-xl font-black text-amber-400">0</span>
                <!-- Floating +1 pop-up -->
                <div id="plus-one" class="absolute -right-8 -top-1 text-emerald-400 font-black text-xl opacity-0 transition-all duration-300 transform translate-y-2 pointer-events-none">+1</div>
            </div>

            <!-- Timer -->
            <div class="flex items-center gap-2 bg-slate-900/80 border border-slate-700 px-3 py-1.5 rounded-full">
                <span class="text-xs text-slate-400 font-bold">시간</span>
                <span id="timer-text" class="text-xl font-mono font-black text-white">60초</span>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="relative flex-1 w-full bg-slate-950">
            <canvas id="game-canvas" class="w-full h-full block"></canvas>
        </div>

        <!-- Touch Controls (Bottom Buttons) -->
        <div id="controls-ui" class="z-10 p-4 bg-slate-900 border-t border-slate-800 grid grid-cols-2 gap-4">
            <button id="btn-left" class="py-4 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 rounded-xl text-2xl active:scale-95 transition-transform flex items-center justify-center shadow-md">
                ◀
            </button>
            <button id="btn-right" class="py-4 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 rounded-xl text-2xl active:scale-95 transition-transform flex items-center justify-center shadow-md">
                ▶
            </button>
        </div>

        <!-- 3. GAME OVER SCREEN -->
        <div id="game-over-screen" class="absolute inset-0 z-20 bg-slate-900/95 flex flex-col justify-between p-6 text-center hidden">
            <div class="my-auto space-y-6">
                <div class="inline-block p-3 bg-red-500/20 rounded-2xl border border-red-500/30">
                    <span class="text-4xl">🏁</span>
                </div>
                <h2 class="text-3xl font-black text-white">게임 종료</h2>
                
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                    <p class="text-slate-400 text-sm font-semibold mb-1">최종 추월 기록</p>
                    <p class="text-5xl font-black text-amber-400" id="final-score">추월 0대</p>
                </div>
            </div>

            <button id="restart-btn" class="w-full py-4 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-black text-lg rounded-xl shadow-lg transition-all transform active:scale-95 mb-2">
                다시 하기
            </button>
        </div>

    </div>

    <!-- Game Logic Script -->
    <script>
        window.onload = function() {
            // DOM Elements
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');
            
            const scoreText = document.getElementById('score-text');
            const timerText = document.getElementById('timer-text');
            const finalScoreText = document.getElementById('final-score');
            const plusOneAnim = document.getElementById('plus-one');
            
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');

            // Game Constants & State Variables
            const TOTAL_TIME = 60; // seconds
            const SPAWN_INTERVAL = 1200; // 1.2 seconds in ms
            const TRAVEL_TIME = 2000; // 2.0 seconds from top to bottom

            let gameState = 'START'; // START, PLAYING, GAMEOVER
            let score = 0;
            let timeRemaining = TOTAL_TIME;
            let lastTime = 0;
            let timerInterval = null;
            let spawnTimer = null;
            let plusOneTimeout = null;

            // Player state
            let playerLane = 1; // 0: left, 1: center, 2: right
            
            // Enemies array
            let enemies = [];
            let nextEnemyId = 1;

            // Layout Dimensions
            let canvasWidth = 0;
            let canvasHeight = 0;
            let laneWidth = 0;
            let carWidth = 0;
            let carHeight = 0;

            // Resize Canvas dynamically to maintain crisp resolution
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                canvasWidth = canvas.width;
                canvasHeight = canvas.height;

                laneWidth = canvasWidth / 3;
                carWidth = laneWidth * 0.55;
                carHeight = carWidth * 1.8;
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Lane X center calculator
            function getLaneCenterX(laneIndex) {
                return laneIndex * laneWidth + laneWidth / 2;
            }

            // Controls logic
            function moveLeft() {
                if (gameState !== 'PLAYING') return;
                if (playerLane > 0) playerLane--;
            }

            function moveRight() {
                if (gameState !== 'PLAYING') return;
                if (playerLane < 2) playerLane++;
            }

            // Keyboard Listeners
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') moveLeft();
                if (e.key === 'ArrowRight') moveRight();
            });

            // Touch / Click Button Listeners
            btnLeft.addEventListener('click', moveLeft);
            btnRight.addEventListener('click', moveRight);

            // Spawn Obstacle (Enemy Car)
            function spawnEnemy() {
                if (gameState !== 'PLAYING') return;
                
                const randomLane = Math.floor(Math.random() * 3);
                enemies.push({
                    id: nextEnemyId++,
                    lane: randomLane,
                    y: -carHeight,
                    initialPlayerLane: playerLane, // Track lane player was in when car spawned
                    scored: false
                });
            }

            // Show Floating "+1" Animation for 0.5 seconds
            function triggerPlusOneAnimation() {
                plusOneAnim.classList.remove('opacity-0', '-translate-y-2');
                plusOneAnim.classList.add('opacity-100', 'translate-y-0');

                if (plusOneTimeout) clearTimeout(plusOneTimeout);
                
                plusOneTimeout = setTimeout(() => {
                    plusOneAnim.classList.remove('opacity-100', 'translate-y-0');
                    plusOneAnim.classList.add('opacity-0', '-translate-y-2');
                }, 500); // 0.5 sec
            }

            // Start Game Logic
            function startGame() {
                score = 0;
                timeRemaining = TOTAL_TIME;
                playerLane = 1;
                enemies = [];
                gameState = 'PLAYING';

                scoreText.textContent = '0';
                timerText.textContent = `${timeRemaining}초`;

                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');

                // Clear previous timers
                if (timerInterval) clearInterval(timerInterval);
                if (spawnTimer) clearInterval(spawnTimer);

                // Start 1-second countdown timer
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    timerText.textContent = `${timeRemaining}초`;
                    if (timeRemaining <= 0) {
                        endGame();
                    }
                }, 1000);

                // Spawn an enemy immediately, then every 1.2s
                spawnEnemy();
                spawnTimer = setInterval(spawnEnemy, SPAWN_INTERVAL);

                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            // End Game Logic
            function endGame() {
                gameState = 'GAMEOVER';
                clearInterval(timerInterval);
                clearInterval(spawnTimer);

                finalScoreText.textContent = `추월 ${score}대`;
                gameOverScreen.classList.remove('hidden');
            }

            // Collision Detection Helper (Simple AABB bounding box)
            function checkCollision(pX, pY, pW, pH, eX, eY, eW, eH) {
                const padding = pW * 0.1;
                return (
                    pX + padding < eX + eW - padding &&
                    pX + pW - padding > eX + padding &&
                    pY + padding < eY + eH - padding &&
                    pY + pH - padding > eY + padding
                );
            }

            // Main Game Loop
            function gameLoop(currentTime) {
                if (gameState !== 'PLAYING') return;

                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;

                // 1. Update Game State
                const speed = (canvasHeight + carHeight) / TRAVEL_TIME;

                const playerX = getLaneCenterX(playerLane) - carWidth / 2;
                const playerY = canvasHeight - carHeight - 30;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    enemy.y += speed * deltaTime;

                    const enemyX = getLaneCenterX(enemy.lane) - carWidth / 2;
                    const enemyY = enemy.y;

                    // A. Collision Check
                    if (checkCollision(playerX, playerY, carWidth, carHeight, enemyX, enemyY, carWidth, carHeight)) {
                        endGame();
                        return;
                    }

                    // B. Overtake Scoring Check
                    const enemyBackY = enemyY + carHeight;
                    const playerFrontY = playerY;

                    if (!enemy.scored && enemyBackY > playerFrontY) {
                        if (enemy.initialPlayerLane === enemy.lane && playerLane !== enemy.lane) {
                            score++;
                            scoreText.textContent = score;
                            triggerPlusOneAnimation();
                        }
                        enemy.scored = true;
                    }

                    // Remove off-screen enemies
                    if (enemy.y > canvasHeight + carHeight) {
                        enemies.splice(i, 1);
                    }
                }

                // 2. Render Canvas
                render(playerX, playerY);

                requestAnimationFrame(gameLoop);
            }

            // Drawing Functions
            function render(playerX, playerY) {
                // Clear background
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                // Draw 3 Lanes (Road dividers)
                ctx.strokeStyle = '#334155';
                ctx.setLineDash([20, 15]);
                ctx.lineWidth = 3;

                for (let i = 1; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * laneWidth, 0);
                    ctx.lineTo(i * laneWidth, canvasHeight);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                // Draw Enemy Cars
                enemies.forEach(enemy => {
                    const eX = getLaneCenterX(enemy.lane) - carWidth / 2;
                    drawCar(eX, enemy.y, carWidth, carHeight, '#ef4444', false);
                });

                // Draw Player Car
                drawCar(playerX, playerY, carWidth, carHeight, '#f59e0b', true);
            }

            // Generic Car Drawing Function
            function drawCar(x, y, w, h, color, isPlayer) {
                const radius = 8;
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.roundRect(x + 3, y + 4, w, h, radius);
                ctx.fill();

                // Main Body
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, radius);
                ctx.fill();

                // Roof/Cabin
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.roundRect(x + w * 0.15, y + h * 0.25, w * 0.7, h * 0.45, 4);
                ctx.fill();

                // Windshield (Front)
                ctx.fillStyle = '#38bdf8';
                const windshieldY = isPlayer ? y + h * 0.22 : y + h * 0.55;
                ctx.beginPath();
                ctx.roundRect(x + w * 0.2, windshieldY, w * 0.6, h * 0.15, 2);
                ctx.fill();

                // Lights
                ctx.fillStyle = isPlayer ? '#fef08a' : '#fee2e2';
                const lightY = isPlayer ? y + 2 : y + h - 6;
                ctx.fillRect(x + 4, lightY, w * 0.2, 4);
                ctx.fillRect(x + w - (w * 0.2) - 4, lightY, w * 0.2, 4);
            }

            // Event Listeners for UI buttons
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);
        };
    </script>
</body>
</html>
